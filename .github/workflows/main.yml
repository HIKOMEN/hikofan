name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: mv app/build/outputs/apk/debug/app-debug.apk HikofanMobil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HikofanMobil-APK
          path: HikofanMobil.apk
      - name: Release olustur (sabit indirme linki icin)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" HikofanMobil.apk \
            --title "HIKOFAN v${{ github.run_number }}" \
            --notes "Otomatik derleme" \
            --latest
